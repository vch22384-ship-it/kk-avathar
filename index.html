<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Reactive Avatar Overlay</title>
  
  <style>
    :root {
      --bg-color: transparent; /* Essential for OBS */
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: var(--font-family);
    }

    /* Container for the avatar to ensure proper scaling */
    #avatar-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img#avatar {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* Instant swapping is better for reactive talking to avoid ghosting */
    }
  </style>
</head>
<body>

  <script>
    // ==========================================
    // CONFIGURATION: SET YOUR GIF FILES HERE
    // ==========================================
    const CONFIG = {
      // Set to false to use your actual local GIF files for OBS
      usePlaceholders: false, 

      // Your actual file names
      files: {
        resting: 'resting.gif',
        talking: 'talking.gif',
        stretch: 'stretch.gif',
        pushup:  'pushup.gif'
      },

      // Placeholders used for testing (Color coded)
      placeholders: {
        resting: 'https://placehold.co/600x600/2ecc71/ffffff?text=Resting+(Quiet)',
        talking: 'https://placehold.co/600x600/e74c3c/ffffff?text=Talking!!!',
        stretch: 'https://placehold.co/600x600/f1c40f/ffffff?text=Stretching...',
        pushup:  'https://placehold.co/600x600/3498db/ffffff?text=Doing+Pushups...'
      },

      // Audio Settings
      volumeThreshold: 15, // 0 to 100. Lower = more sensitive
      holdTimeMs: 150,     // Time to wait after you stop talking before going to resting

      // Idle Sequence Timing (Strict 10-second cycles)
      idleCycleTimeMs: 10000 
    };

    // Determine which set of images to use based on config
    const ASSETS = CONFIG.usePlaceholders ? CONFIG.placeholders : CONFIG.files;
    const preloadedImages = {}; 

    // Preload assets to prevent flickering on first load
    function preloadAssets() {
      for (const [key, src] of Object.entries(ASSETS)) {
        const img = new Image();
        img.src = src;
        preloadedImages[key] = img;
      }
      console.log("Assets preloaded successfully.");
    }

    // Finite State Machine (FSM) to handle strict sequential transitions
    class AvatarBrain {
      constructor(imgElement) {
        this.imgElement = imgElement;
        this.currentState = null;
        this.idleCycleTimer = null;
        this.talkHoldTimer = null;
        this.idleSequence = ['resting', 'stretch', 'pushup'];
        this.lastIdleState = null;
      }

      setState(newState) {
        if (CONFIG.showDebugMenu) {
          document.getElementById('debug-state').innerText = newState;
          document.getElementById('debug-state').style.color = (newState === 'talking') ? '#e74c3c' : '#f1c40f';
        }
      }

      getRandomIdleState() {
        // Filter out the last played idle state to prevent consecutive duplicates
        const availableStates = this.idleSequence.filter(state => state !== this.lastIdleState);
        const randomIndex = Math.floor(Math.random() * availableStates.length);
        const chosenState = availableStates[randomIndex];
        this.lastIdleState = chosenState;
        return chosenState;
      }

      startIdleCycle(isInitialLoad = false) {
        this.stopIdleCycle(); 
        
        let nextState;
        if (isInitialLoad) {
          nextState = 'resting';
          this.lastIdleState = 'resting';
        } else {
          nextState = this.getRandomIdleState();
        }

        this.setState(nextState);
        
        this.idleCycleTimer = setInterval(() => {
          this.setState(this.getRandomIdleState());
        }, CONFIG.idleCycleTimeMs);
      }

      stopIdleCycle() {
        if (this.idleCycleTimer) {
          clearInterval(this.idleCycleTimer);
          this.idleCycleTimer = null;
        }
      }

      processAudioFrame(volume) {
        const isLoud = volume > CONFIG.volumeThreshold;

        if (isLoud) {
          // If we are currently holding the talking state, cancel the timeout
          if (this.talkHoldTimer) {
            clearTimeout(this.talkHoldTimer);
            this.talkHoldTimer = null;
          }
          
          if (this.currentState !== 'talking') {
            this.stopIdleCycle(); // Instantly interrupt any non-talking GIF
            this.setState('talking');
          }
        } else {
          if (this.currentState === 'talking' && !this.talkHoldTimer) {
            // Cut back to resting almost instantly (50ms)
            this.talkHoldTimer = setTimeout(() => {
              this.startIdleCycle(false); // Start random idle cycle
              this.talkHoldTimer = null;
            }, CONFIG.holdTimeMs);
          }
        }
      }
    }

    class AudioEngine {
      constructor(onVolumeUpdate) {
        this.onVolumeUpdate = onVolumeUpdate;
        this.audioContext = null;
        this.analyser = null;
        this.microphone = null;
        this.dataArray = null;
        this.isListening = false;
      }

      async start() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioContext = new AudioContext();
          this.analyser = this.audioContext.createAnalyser();
          
          this.microphone = this.audioContext.createMediaStreamSource(stream);
          this.microphone.connect(this.analyser);

          // Configure analyser for smooth volume reading
          this.analyser.smoothingTimeConstant = 0.5; // Adjusted for snappy response
          this.analyser.fftSize = 256;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.isListening = true;
          this.loop();
          return true;
        } catch (err) {
          console.warn("Microphone access blocked or failed:", err);
          // Removed alert() here so OBS doesn't freeze on errors
          return false;
        }
      }

      loop() {
        if (!this.isListening) return;

        this.analyser.getByteFrequencyData(this.dataArray);
        
        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i];
        }
        let averageVolume = sum / this.dataArray.length;

        this.onVolumeUpdate(averageVolume);
        requestAnimationFrame(() => this.loop());
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      preloadAssets();

      const avatarImg = document.getElementById('avatar');
      
      const avatarController = new AvatarBrain(avatarImg);
      const audioEngine = new AudioEngine((volume) => {
        avatarController.processAudioFrame(volume);
      });

      avatarController.startIdleCycle(true); // True ensures 'resting' on first load
      await audioEngine.start();
    });
  </script>
</body>
</html>
