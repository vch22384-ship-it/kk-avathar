<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Reactive Avatar Overlay</title>
  
  <style>
    :root {
      --bg-color: transparent; 
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: var(--font-family);
    }

    #avatar-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    img#avatar {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Debug UI to help you tune your mic sensitivity */
    #debug-ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 14px;
      z-index: 9999;
      display: none; /* Controlled by JS config */
    }

    #vol-bar-container {
      width: 150px;
      height: 10px;
      background: #333;
      margin-top: 8px;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    #vol-bar {
      width: 0%;
      height: 100%;
      background: lime;
      transition: width 0.05s ease;
    }
    
    #thresh-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: red;
      z-index: 10;
    }

    /* Screen to bypass browser autoplay blocks */
    #click-to-start {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      z-index: 10000;
      cursor: pointer;
      display: none; /* Hidden by default, shows only if blocked */
    }
  </style>
</head>
<body>

  <!-- Screen to bypass strict browser audio blocks -->
  <div id="click-to-start">🎙️ Click anywhere to allow Microphone access</div>

  <!-- Live Debug Menu for tuning -->
  <div id="debug-ui">
    <div>State: <span id="debug-state" style="color: #f1c40f;">resting</span></div>
    <div>Vol: <span id="debug-vol">0</span> / Thresh: <span id="debug-thresh">35</span></div>
    <div id="vol-bar-container">
      <div id="thresh-line"></div>
      <div id="vol-bar"></div>
    </div>
  </div>

  <!-- The Avatar Container -->
  <div id="avatar-container">
    <img id="avatar" src="" alt="Reactive Avatar">
  </div>

  <script>
    // ==========================================
    // CONFIGURATION: SET YOUR GIF FILES HERE
    // ==========================================
    const CONFIG = {
      // Change to false once you figure out your perfect volume threshold
      showDebugMenu: true, 

      files: {
        resting: 'resting.gif',
        talking: 'talking.gif',
        stretch: 'stretch.gif',
        pushup:  'pushup.gif'
      },

      // AUDIO SENSITIVITY TWEAKS
      volumeThreshold: 35, 
      holdTimeMs: 50,      
      idleCycleTimeMs: 10000 
    };

    // The list of animations to play randomly when quiet
    const IDLE_STATES = ['resting', 'stretch', 'pushup'];
    const preloadedImages = {}; 

    // Setup Debug UI
    if (CONFIG.showDebugMenu) {
      document.getElementById('debug-ui').style.display = 'block';
      document.getElementById('debug-thresh').innerText = CONFIG.volumeThreshold;
      const threshPercent = Math.min((CONFIG.volumeThreshold / 100) * 100, 100);
      document.getElementById('thresh-line').style.left = threshPercent + '%';
    }

    function preloadAssets() {
      for (const [key, src] of Object.entries(CONFIG.files)) {
        const img = new Image();
        img.src = src;
        preloadedImages[key] = img;
      }
    }

    class AvatarBrain {
      constructor(imgElement) {
        this.imgElement = imgElement;
        this.currentState = null;
        this.idleCycleTimer = null;
        this.talkHoldTimer = null;
      }

      setState(newState) {
        if (this.currentState === newState) return;
        this.currentState = newState;
        
        // Force replace the GIF instantly
        this.imgElement.src = CONFIG.files[newState];

        if (CONFIG.showDebugMenu) {
          document.getElementById('debug-state').innerText = newState;
          document.getElementById('debug-state').style.color = (newState === 'talking') ? '#e74c3c' : '#f1c40f';
        }
      }

      setRandomIdleState() {
        let nextState;
        // Loop ensures we don't pick the same animation twice in a row
        do {
          nextState = IDLE_STATES[Math.floor(Math.random() * IDLE_STATES.length)];
        } while (nextState === this.currentState && IDLE_STATES.length > 1);
        
        this.setState(nextState);
      }

      startIdleCycle() {
        this.stopIdleCycle(); 
        this.setRandomIdleState(); // Pick a random gif immediately upon becoming quiet
        
        // Keep picking new random gifs every X seconds while quiet
        this.idleCycleTimer = setInterval(() => {
          this.setRandomIdleState();
        }, CONFIG.idleCycleTimeMs);
      }

      stopIdleCycle() {
        if (this.idleCycleTimer) {
          clearInterval(this.idleCycleTimer);
          this.idleCycleTimer = null;
        }
      }

      processAudioFrame(volume) {
        const isLoud = volume > CONFIG.volumeThreshold;

        // Update Debug UI Live
        if (CONFIG.showDebugMenu) {
          document.getElementById('debug-vol').innerText = Math.round(volume);
          const volPercent = Math.min((volume / 100) * 100, 100);
          const bar = document.getElementById('vol-bar');
          bar.style.width = volPercent + '%';
          bar.style.background = isLoud ? 'red' : 'lime';
        }

        if (isLoud) {
          if (this.talkHoldTimer) {
            clearTimeout(this.talkHoldTimer);
            this.talkHoldTimer = null;
          }
          
          if (this.currentState !== 'talking') {
            this.stopIdleCycle(); 
            this.setState('talking'); // Instant cut to talking
          }
        } else {
          if (this.currentState === 'talking' && !this.talkHoldTimer) {
            // Cut back to a RANDOM resting animation almost instantly
            this.talkHoldTimer = setTimeout(() => {
              this.startIdleCycle(); 
              this.talkHoldTimer = null;
            }, CONFIG.holdTimeMs);
          }
        }
      }
    }

    class AudioEngine {
      constructor(onVolumeUpdate) {
        this.onVolumeUpdate = onVolumeUpdate;
        this.audioContext = null;
        this.analyser = null;
        this.microphone = null;
        this.dataArray = null;
        this.isListening = false;
      }

      async start() {
        try {
          // This naturally prompts the browser to ask for Microphone access
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioContext = new AudioContext();
          
          // Fallback logic: If the browser suspends the audio context due to lack of click, show the unlock screen
          if (this.audioContext.state === 'suspended') {
            const unlockScreen = document.getElementById('click-to-start');
            unlockScreen.style.display = 'flex';
            
            await new Promise(resolve => {
              unlockScreen.onclick = () => {
                this.audioContext.resume();
                unlockScreen.style.display = 'none';
                resolve();
              };
            });
          }

          this.analyser = this.audioContext.createAnalyser();
          this.microphone = this.audioContext.createMediaStreamSource(stream);
          this.microphone.connect(this.analyser);

          this.analyser.smoothingTimeConstant = 0.2; 
          this.analyser.fftSize = 256;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.isListening = true;
          this.loop();
          return true;
        } catch (err) {
          console.warn("Microphone access blocked or failed:", err);
          document.getElementById('click-to-start').innerText = "❌ Microphone access blocked. Check browser settings.";
          document.getElementById('click-to-start').style.display = 'flex';
          return false;
        }
      }

      loop() {
        if (!this.isListening) return;

        this.analyser.getByteFrequencyData(this.dataArray);
        
        let sum = 0;
        for (let i = 0; i < this.dataArray.length; i++) {
          sum += this.dataArray[i];
        }
        let averageVolume = sum / this.dataArray.length;

        this.onVolumeUpdate(averageVolume);
        requestAnimationFrame(() => this.loop());
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      preloadAssets();

      const avatarImg = document.getElementById('avatar');
      
      const avatarController = new AvatarBrain(avatarImg);
      const audioEngine = new AudioEngine((volume) => {
        avatarController.processAudioFrame(volume);
      });

      // Show resting image immediately before mic starts
      avatarController.setState('resting');

      // Boot up the microphone processing
      const micSuccess = await audioEngine.start();
      if (micSuccess) {
         avatarController.startIdleCycle();
      }
    });
  </script>
</body>
</html>
